<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f8f9fa">
    <title>Messages</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* --- Global Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f1f3f4;
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* --- App Container --- */
        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: #f8f9fa;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* --- 1. Main Chat List View --- */
        .main-screen {
            flex: 1;
            background-color: #f8f9fa;
            overflow-y: auto;
            padding-bottom: 80px;
            border-radius: 20px 20px 0 0;
            margin-top: 10px;
        }
        
        .top-header {
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px 20px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
        }
        .top-header h1 {
            font-size: 22px;
            font-weight: 400;
            color: #202124;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }
        .top-header h1 span { font-weight: 600; color: #202124; margin-right: 5px; }
        .header-icons { display: flex; align-items: center; gap: 20px; }
        .search-icon { font-size: 24px; color: #202124; }
        
        .top-avatar-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px #1a73e8;
        }

        /* Chat List Items */
        .chat-item {
            display: flex;
            padding: 15px 20px;
            cursor: pointer;
            align-items: center;
        }
        .chat-item:active { background-color: #e8eaed; }
        
        .avatar-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .chat-details {
            flex: 1;
            min-width: 0;
        }
        .chat-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            align-items: center;
        }
        .chat-name {
            font-weight: 500;
            color: #202124;
            font-size: 17px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #5f6368;
        }
        .unread-badge {
            background-color: #1e8e3e;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .chat-msg {
            font-size: 15px;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .chat-msg.rtl {
            direction: rtl;
            text-align: right;
            font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif;
            font-size: 17px;
        }

        /* --- FAB Button --- */
        .fab {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: 20px;
            background-color: #c4eed0;
            color: #0d652d;
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-weight: 500;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 5;
        }

        /* --- 2. Chat View (Inner Screen) --- */
        .chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background-color: #f8f9fa;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: calc(10px + env(safe-area-inset-top)) 15px 10px 15px;
            background: #f8f9fa;
            cursor: pointer; /* Makes the whole header clickable for profile */
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            margin-right: 15px;
            color: #202124;
            z-index: 15; /* Prevents click from triggering profile */
        }
        .header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .header-info h3 {
            font-size: 18px;
            color: #202124;
            font-weight: 500;
        }
        .header-icons-right {
            display: flex;
            gap: 20px;
            font-size: 20px;
            color: #202124;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #f8f9fa;
            transition: filter 0.3s ease;
        }
        
        .msg-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .msg-bubble.active-press {
            transform: scale(0.98);
            opacity: 0.9;
            background-color: #d1d5db !important;
        }
        
        .msg-received {
            background-color: #e8eaed;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .msg-sent {
            background-color: #b5e7a0; 
            color: #202124;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .rtl-text { 
            direction: rtl; 
            text-align: right; 
            font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif; 
            font-size: 18px; 
            line-height: 1.8;
        }
        
        .sending-text {
            text-align: center;
            font-size: 13px;
            color: #5f6368;
            margin: 10px 0;
        }
        .sending-text span { text-decoration: underline; color: #5f6368; }
        
        .time-stamp {
            text-align: center;
            font-size: 13px;
            color: #5f6368;
            margin: 15px 0 5px 0;
        }

        /* Input Area */
        .chat-input-area {
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom)) 15px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .plus-icon {
            font-size: 26px;
            color: #5f6368;
            cursor: pointer;
        }
        .input-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border: 1px solid #dadce0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .chat-input-area input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }
        
        .input-icons { 
            display: flex; 
            gap: 12px; 
            font-size: 20px; 
            align-items: center;
        }
        .input-icons .emoji-icon { color: #fbbc04; }
        .input-icons .image-icon { color: #1a73e8; }
        
        .chat-input-area button.send-btn {
            background: #c4eed0;
            color: #0d652d; 
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-input-area button.send-btn svg {
            width: 24px;
            height: 24px;
            fill: #0d652d;
        }

        /* --- 3. Long Press Floating Menu (First Image Style) --- */
        .floating-menu-overlay {
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); 
            display: none; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            z-index: 200;
            backdrop-filter: blur(2px);
        }
        
        .floating-avatar {
            width: 150px;
            height: 150px;
            border-radius: 30px; /* Rounded square like in image */
            background: #ffca28;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .floating-avatar svg {
            width: 80px;
            height: 80px;
            fill: #fff;
        }

        .floating-actions {
            background: #fff;
            border-radius: 40px;
            display: flex;
            padding: 10px 20px;
            gap: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .floating-action-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #5f6368;
        }
        .floating-action-btn:active {
            background: #f1f3f4;
        }

        /* --- 4. Profile / Contact Info Screen (Second Image Style) --- */
        .profile-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            background-color: #f8f9fa;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 300;
            overflow-y: auto;
        }
        
        .profile-header {
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px 20px;
            display: flex;
            align-items: center;
        }
        
        .profile-content {
            padding: 0 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-big-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ffca28;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .profile-big-avatar svg {
            width: 60px;
            height: 60px;
            fill: #fff;
        }

        .profile-name {
            font-size: 24px;
            color: #202124;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .profile-top-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
            justify-content: center;
        }
        .profile-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .profile-action-btn {
            width: 80px;
            height: 50px;
            border-radius: 25px;
            background: #e6f4ea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d652d;
            font-size: 20px;
        }
        .profile-action span {
            font-size: 13px;
            color: #202124;
        }

        /* Profile Cards */
        .profile-card {
            background: #fff;
            border-radius: 15px;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .profile-card-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .profile-card-left .icon {
            font-size: 20px;
            color: #5f6368;
        }
        .profile-card-text {
            display: flex;
            flex-direction: column;
        }
        .profile-card-text .title {
            font-size: 16px;
            color: #202124;
            margin-bottom: 2px;
        }
        .profile-card-text .subtitle {
            font-size: 14px;
            color: #5f6368;
        }
        
        /* Switch Icon Fix */
        .switch-icon {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #0d652d;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        .switch-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* List Items */
        .profile-list-item {
            background: #fff;
            border-radius: 15px;
            width: 100%;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 16px;
            color: #202124;
            cursor: pointer;
        }
        .profile-list-item.danger {
            color: #d93025;
        }
        .profile-list-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- Admin Panel --- */
        .admin-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: none;
            justify-content: center; align-items: center; z-index: 400;
        }
        .admin-panel {
            background: #fff; padding: 25px 20px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 350px;
            max-height: 90vh; overflow-y: auto;
        }
        .admin-panel h3 { text-align: center; margin-bottom: 10px; }
        .admin-panel label { font-size: 13px; font-weight: bold; color: #5f6368; }
        .admin-panel input { padding: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 15px; }
        .admin-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .admin-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;}
        .btn-save { background: #1a73e8; color: white; }
        .btn-close { background: #f1f3f4; color: #5f6368; }

        /* --- Toast --- */
        #toast {
            visibility: hidden; min-width: 200px; background-color: #333; color: #fff;
            text-align: center; border-radius: 25px; padding: 12px 20px; position: fixed;
            z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. Main Chat List -->
        <div class="main-screen" id="main-screen">
            <div class="top-header">
                <h1><span>Google</span> Messages</h1>
                <div class="header-icons">
                    <span class="search-icon">🔍</span>
                    <img src="https://i.ibb.co/8gvbm3XM/160165.jpg" class="top-avatar-img" alt="Profile">
                </div>
            </div>

            <div class="chat-item" onclick="openChat('0303 0300000', '#ab47bc', '0')">
                <div class="avatar-circle" style="background: #ab47bc;">0</div>
                <div class="chat-details">
                    <div class="chat-top">
                        <span class="chat-name">0303 0300000</span>
                        <div class="chat-meta"><span>6 min</span></div>
                    </div>
                    <div class="chat-msg rtl">معزز صارف، کیا آپ اپنے علاقے کے موسم...</div>
                </div>
            </div>

            <!-- Target Chat -->
            <div class="chat-item" onclick="openChat(currentChatId, '#ffca28', currentAvatarLetter)">
                <div class="avatar-circle" id="list-avatar" style="background: #ffca28;">9</div>
                <div class="chat-details">
                    <div class="chat-top">
                        <span class="chat-name" id="list-chat-name">9771</span>
                        <div class="chat-meta"><span></span></div>
                    </div>
                    <div class="chat-msg rtl" id="preview-token-msg">آپ ٹوکن نمبر 7715583817 سے...</div>
                </div>
            </div>

        </div>

        <button class="fab" id="start-chat-btn">💬 Start chat</button>

        <!-- 2. Inner Chat View -->
        <div class="chat-view" id="chat-view">
            <!-- Clickable Header to open Profile -->
            <div class="chat-header" onclick="openProfile()">
                <button class="back-btn" onclick="closeChat(event)">←</button>
                <div class="header-info">
                    <div class="avatar-circle" id="current-avatar" style="width: 40px; height: 40px; font-size: 22px; margin-right:0; background: #ffca28;">9</div>
                    <h3 id="current-name">9771</h3>
                </div>
                <div class="header-icons-right">
                    <span>📞</span>
                    <span>⋮</span>
                </div>
            </div>
            
            <div class="messages-area" id="messages-area">
                <!-- Messages load here -->
            </div>

            <div class="chat-input-area">
                <div class="plus-icon">⊕</div>
                <div class="input-wrapper">
                    <input type="text" id="msg-input" placeholder="2 Jazz • Text message" onkeypress="handleEnter(event)">
                    <div class="input-icons">
                        <span class="emoji-icon">😊</span>
                        <span class="image-icon">🖼️</span>
                    </div>
                </div>
                <button class="send-btn" onclick="sendCustomMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

        <!-- 3. Floating Long Press Menu -->
        <div class="floating-menu-overlay" id="floating-menu" onclick="closeFloatingMenu(event)">
            <div class="floating-avatar">
                <!-- User SVG Icon -->
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="floating-actions">
                <button class="floating-action-btn" onclick="replyMessage()">💬</button>
                <button class="floating-action-btn" onclick="callContact()">📞</button>
                <button class="floating-action-btn" onclick="addContact()">👤+</button>
                <button class="floating-action-btn" onclick="infoMessage()">ℹ️</button>
            </div>
        </div>

        <!-- 4. Profile / Contact Info Screen -->
        <div class="profile-screen" id="profile-screen">
            <div class="profile-header">
                <button class="back-btn" onclick="closeProfile()">←</button>
            </div>
            
            <div class="profile-content">
                <div class="profile-big-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                
                <div class="profile-name" id="profile-name-text">9771</div>

                <div class="profile-top-actions">
                    <div class="profile-action" onclick="callContact()">
                        <div class="profile-action-btn">📞</div>
                        <span>Call</span>
                    </div>
                    <div class="profile-action" onclick="addContact()">
                        <div class="profile-action-btn">👤+</div>
                        <span>Add contact</span>
                    </div>
                    <div class="profile-action">
                        <div class="profile-action-btn">🔍</div>
                        <span>Search</span>
                    </div>
                </div>

                <!-- Sending with Card (Fix measurement) -->
                <div class="profile-card">
                    <div class="profile-card-left">
                        <div class="icon">💳</div>
                        <div class="profile-card-text">
                            <span class="title">2 Jazz</span>
                            <span class="subtitle">0329 1667662</span>
                        </div>
                    </div>
                    <div class="switch-icon">
                        <svg viewBox="0 0 24 24"><path d="M7 10l5-5 5 5H7zm0 4l5 5 5-5H7z"/></svg>
                        Switch
                    </div>
                </div>

                <!-- List Items -->
                <div class="profile-list-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
                    Chat theme
                </div>
                <div class="profile-list-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Snooze chat
                </div>
                <div class="profile-list-item">
                    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Notifications
                </div>
                <div class="profile-list-item">
                    <svg viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
                    Archive
                </div>
                <div class="profile-list-item danger" onclick="blockContact()">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                    Block & report spam
                </div>

            </div>
        </div>

    </div>

    <!-- Admin Panel -->
    <div class="admin-overlay" id="admin-overlay">
        <div class="admin-panel">
            <h3>Admin Settings</h3>
            <label>Chat Number / Name</label>
            <input type="text" id="admin-chat-id" placeholder="Enter chat number">
            <label>Avatar Letter</label>
            <input type="text" id="admin-avatar-letter" placeholder="Enter 1 letter or number" maxlength="2">
            <label>Update Bike/Sawari Number</label>
            <input type="text" id="bike-input" placeholder="Enter bike number">
            <label>Update Token Number</label>
            <input type="text" id="token-input" placeholder="Enter token number">
            <div class="admin-buttons">
                <button class="btn-close" onclick="closeAdmin()">Cancel</button>
                <button class="btn-save" onclick="updateData()">Update Data</button>
            </div>
        </div>
    </div>

    <div id="toast">Message</div>

    <script>
        // --- Data & State ---
        let currentToken = "7715583817";
        let currentBikeNumber = "LEX-11-2259";
        let currentChatId = "9771";
        let currentAvatarLetter = "9";

        let defaultMessages = [
            { id: 1, type: 'received', text: 'آپ ٹوکن نمبر 7715583817 سے سواری رجسٹر ہو سکتی ہے۔', rtl: true },
            { id: 2, type: 'sent', text: 'REG 3230373410243 LEX2277 P 09052011' },
            { id: 3, type: 'received', text: 'رجسٹریشن ناکام۔ 8 گھنٹے بعد دوبارہ کوشش کریں۔', rtl: true },
            { id: 4, type: 'system', text: 'Sending with Jazz' },
            { id: 5, type: 'received', text: 'رجسٹریشن کامیاب! فائل ریلیف ٹوکن کے لئے TOK لکھ کر بھیجیں۔', rtl: true },
            { id: 6, type: 'sent', text: 'TOK' }
        ];

        let messagesData = [];

        function loadData() {
            const savedToken = localStorage.getItem('app_token');
            const savedBike = localStorage.getItem('app_bike');
            const savedChatId = localStorage.getItem('app_chat_id');
            const savedAvatar = localStorage.getItem('app_avatar_letter');
            const savedMessages = localStorage.getItem('app_messages');

            if (savedToken) currentToken = savedToken;
            if (savedBike) currentBikeNumber = savedBike;
            if (savedChatId) currentChatId = savedChatId;
            if (savedAvatar) currentAvatarLetter = savedAvatar;
            
            if (savedMessages) {
                messagesData = JSON.parse(savedMessages);
            } else {
                messagesData = [...defaultMessages];
            }
            
            updateUIElements();
        }

        function saveData() {
            localStorage.setItem('app_token', currentToken);
            localStorage.setItem('app_bike', currentBikeNumber);
            localStorage.setItem('app_chat_id', currentChatId);
            localStorage.setItem('app_avatar_letter', currentAvatarLetter);
            localStorage.setItem('app_messages', JSON.stringify(messagesData));
        }

        function getTokenMessage() {
            return `آپ نے ٹوکن نمبر ${currentToken} سے سواری ${currentBikeNumber} کے لیے پٹرول پر 500 روپے ریلیف حاصل کرلیا ہے۔ آپ اپنا اگلا ٹوکن 01-Nov کو بنا سکتے ہیں۔`;
        }

        function updateUIElements() {
            document.getElementById('list-chat-name').innerText = currentChatId;
            document.getElementById('list-avatar').innerText = currentAvatarLetter;
            document.getElementById('current-name').innerText = currentChatId;
            document.getElementById('current-avatar').innerText = currentAvatarLetter;
            document.getElementById('profile-name-text').innerText = currentChatId;
            
            const previewElement = document.getElementById('preview-token-msg');
            if(previewElement) {
                previewElement.innerText = `آپ ٹوکن نمبر ${currentToken} سے سواری...`;
            }
        }

        // --- Navigation ---
        function openChat(id, color, avatarText) {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('chat-view').style.display = 'flex';
            
            const avatarDiv = document.getElementById('current-avatar');
            avatarDiv.style.background = color;

            if(id === currentChatId) {
                renderAllMessages();
            } else {
                document.getElementById('messages-area').innerHTML = `<div style="text-align:center; color:#888; margin-top:20px;">No messages.</div>`;
            }
        }

        function closeChat(event) {
            if(event) event.stopPropagation(); // Prevents opening profile when clicking back
            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }

        function openProfile() {
            document.getElementById('profile-screen').style.display = 'flex';
        }

        function closeProfile() {
            document.getElementById('profile-screen').style.display = 'none';
        }

        // --- Chat Rendering ---
        function renderAllMessages() {
            const area = document.getElementById('messages-area');
            area.innerHTML = '';

            messagesData.forEach(msg => {
                if(msg.type === 'system') {
                    const div = document.createElement('div');
                    div.className = 'sending-text';
                    div.innerHTML = 'Sending with <span>Jazz</span>';
                    area.appendChild(div);
                } else {
                    renderBubble(area, msg.type, msg.text, msg.rtl, msg.id);
                }
            });

            const timeDiv = document.createElement('div');
            timeDiv.className = 'time-stamp';
            timeDiv.innerText = 'Sunday • 3:14 PM';
            area.appendChild(timeDiv);

            const tokenDiv = document.createElement('div');
            tokenDiv.className = 'msg-bubble msg-received rtl-text';
            tokenDiv.innerText = getTokenMessage();
            addLongPressEvent(tokenDiv, 'dynamic_token');
            area.appendChild(tokenDiv);
            
            setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
        }

        function renderBubble(container, type, text, isRtl, msgId) {
            const div = document.createElement('div');
            div.className = `msg-bubble ${type === 'sent' ? 'msg-sent' : 'msg-received'}`;
            if (isRtl) div.classList.add('rtl-text');
            div.innerText = text;
            
            if(msgId) addLongPressEvent(div, msgId);
            container.appendChild(div);
        }

        // --- Long Press Logic (Floating Menu) ---
        let pressTimer;
        function addLongPressEvent(element, msgId) {
            const startPress = () => {
                element.classList.add('active-press');
                pressTimer = setTimeout(() => {
                    element.classList.remove('active-press');
                    openFloatingMenu();
                }, 600); 
            };
            const cancelPress = () => {
                element.classList.remove('active-press');
                clearTimeout(pressTimer);
            };
            element.addEventListener('touchstart', startPress, {passive: true});
            element.addEventListener('touchend', cancelPress);
            element.addEventListener('touchmove', cancelPress);
            element.addEventListener('mousedown', startPress);
            element.addEventListener('mouseup', cancelPress);
            element.addEventListener('mouseleave', cancelPress);
        }

        function openFloatingMenu() {
            document.getElementById('floating-menu').style.display = 'flex';
        }

        function closeFloatingMenu(event) {
            if(event.target === document.getElementById('floating-menu')) {
                document.getElementById('floating-menu').style.display = 'none';
            }
        }

        // Floating Menu Actions
        function replyMessage() {
            showToast("Reply Mode");
            closeFloatingMenu({target: document.getElementById('floating-menu')});
        }
        function infoMessage() {
            showToast("Message Info");
            closeFloatingMenu({target: document.getElementById('floating-menu')});
        }

        // --- Profile Actions ---
        function callContact() {
            window.location.href = `tel:${currentChatId}`;
        }
        function addContact() {
            showToast("Contact Added!");
        }
        function blockContact() {
            showToast("Contact Blocked!");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // --- Sending Message ---
        function sendCustomMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;

            messagesData.push({ id: Date.now(), type: 'sent', text: text });
            saveData();
            input.value = '';
            renderAllMessages();
        }

        function handleEnter(e) {
            if(e.key === 'Enter') sendCustomMessage();
        }

        // --- Admin Panel ---
        let clickCount = 0;
        document.getElementById('start-chat-btn').addEventListener('click', function() {
            clickCount++;
            if (clickCount === 3) { openAdmin(); clickCount = 0; }
            setTimeout(() => { clickCount = 0; }, 600);
        });

        function openAdmin() {
            document.getElementById('admin-overlay').style.display = 'flex';
            document.getElementById('token-input').value = currentToken;
            document.getElementById('bike-input').value = currentBikeNumber;
            document.getElementById('admin-chat-id').value = currentChatId;
            document.getElementById('admin-avatar-letter').value = currentAvatarLetter;
        }

        function closeAdmin() {
            document.getElementById('admin-overlay').style.display = 'none';
        }

        function updateData() {
            const newToken = document.getElementById('token-input').value.trim();
            const newBike = document.getElementById('bike-input').value.trim();
            const newChatId = document.getElementById('admin-chat-id').value.trim();
            const newAvatar = document.getElementById('admin-avatar-letter').value.trim();
            
            if(newToken && newBike && newChatId && newAvatar) {
                currentToken = newToken;
                currentBikeNumber = newBike;
                currentChatId = newChatId;
                currentAvatarLetter = newAvatar;
                
                saveData();
                updateUIElements();
                
                if(document.getElementById('chat-view').style.display === 'flex') renderAllMessages();
                showToast("Data Updated!");
                closeAdmin();
            } else {
                showToast("Please fill all fields");
            }
        }

        // Init
        window.onload = function() {
            loadData();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail', err));
            }
        };
    </script>
</body>
</html>
