<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages Clone</title>
    <style>
        /* --- Global Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Prevents text selection on long press */
        }
        body {
            background-color: #f1f3f4;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- App Container --- */
        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* --- Header (List View) --- */
        .header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 500;
            color: #202124;
        }
        .header h1 span { color: #1a73e8; font-weight: bold; }
        
        .top-avatar {
            position: absolute;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00695c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid #1a73e8;
        }

        /* --- Chat List View --- */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }
        .chat-item {
            display: flex;
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover {
            background-color: #f8f9fa;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .chat-details {
            flex: 1;
            border-bottom: 1px solid #f1f3f4;
            padding-bottom: 12px;
            min-width: 0;
        }
        .chat-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .chat-name {
            font-weight: 500;
            color: #202124;
            font-size: 16px;
        }
        .chat-time {
            font-size: 12px;
            color: #5f6368;
        }
        .chat-msg {
            font-size: 14px;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Chat View (Inside) --- */
        .chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background-color: #f8f9fa;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
            color: #202124;
        }
        .chat-header-info h3 {
            font-size: 16px;
            color: #202124;
        }
        
        .messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .msg-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .msg-bubble.active-press {
            background-color: #d1d5db !important; /* Highlight on hold */
        }
        
        .msg-received {
            background-color: #e8eaed;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .msg-sent {
            background-color: #b5e7a0; 
            color: #202124;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        /* RTL Support for Urdu */
        .rtl-text { direction: rtl; text-align: right; font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif; font-size: 17px; }
        
        .sending-text {
            text-align: center;
            font-size: 12px;
            color: #5f6368;
            margin: 5px 0;
        }
        .sending-text span { text-decoration: underline; color: #5f6368; }
        .jazz-text { color: #8e24aa; font-size: 12px; margin-left: 5px; margin-bottom: 10px; }

        /* --- Input Area --- */
        .chat-input-area {
            padding: 8px 10px;
            background: #f1f3f4;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #e0e0e0;
        }
        .plus-icon {
            font-size: 24px;
            color: #5f6368;
            cursor: pointer;
            padding: 0 5px;
        }
        .input-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            border: 1px solid #dadce0;
        }
        .chat-input-area input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 8px 0;
            background: transparent;
        }
        .smile-icon {
            font-size: 20px;
            color: #5f6368;
            margin-left: 10px;
        }
        
        /* FIXED: Changed Send Button to Paper Plane/Send Icon */
        .chat-input-area button.send-btn {
            background: #1a73e8; /* Google Blue */
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .chat-input-area button.send-btn:active {
            background: #1557b0;
        }

        /* --- Floating Action Button --- */
        .fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #a8dab5;
            color: #202124;
            border: none;
            padding: 15px 20px;
            border-radius: 25px;
            font-weight: 500;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }

        /* --- Admin Panel --- */
        .admin-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .admin-panel {
            background: #fff;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 350px;
        }
        .admin-panel h3 { text-align: center; color: #202124; margin-bottom: 10px; font-size: 18px;}
        .admin-panel label { font-size: 13px; color: #5f6368; font-weight: bold; margin-bottom: -5px;}
        .admin-panel input {
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            background: #f8f9fa;
        }
        .admin-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .admin-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-save { background: #1a73e8; color: white; }
        .btn-close { background: #f1f3f4; color: #5f6368; }

        /* --- Toast Notification --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 25px;
            padding: 15px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* --- Message Action Menu (Delete/Forward) --- */
        .action-menu-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .action-menu {
            background: #fff;
            border-radius: 12px;
            width: 80%;
            max-width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        .action-menu-btn {
            padding: 15px;
            font-size: 16px;
            color: #202124;
            text-align: left;
            border: none;
            background: transparent;
            border-bottom: 1px solid #f1f3f4;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .action-menu-btn:hover { background: #f8f9fa; }
        .action-menu-btn.danger { color: #d93025; }
        .action-menu-btn:last-child { border-bottom: none; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Chat List -->
        <div class="chat-list" id="main-list">
            <div class="header">
                <h1><span>Google</span> Messages</h1>
                <div class="top-avatar">a</div>
            </div>

            <div class="chat-item" onclick="openChat('8558', '#4dd0e1')">
                <div class="avatar" style="background: #4dd0e1;">👤</div>
                <div class="chat-details">
                    <div class="chat-top"><span class="chat-name">8558</span><span class="chat-time">41 min</span></div>
                    <div class="chat-msg">Your account is currently in a could...</div>
                </div>
            </div>

            <div class="chat-item" onclick="openChat('7911', '#ffb74d')">
                <div class="avatar" style="background: #ffb74d;">👤</div>
                <div class="chat-details">
                    <div class="chat-top"><span class="chat-name">7911</span><span class="chat-time">57 min</span></div>
                    <div class="chat-msg" style="color:#d93025;">⚠ You: V</div>
                </div>
            </div>

            <div class="chat-item" onclick="openChat('667', '#ffb74d')">
                <div class="avatar" style="background: #ffb74d;">👤</div>
                <div class="chat-details">
                    <div class="chat-top"><span class="chat-name">667</span><span class="chat-time">10:16 AM</span></div>
                    <div class="chat-msg" style="color:#d93025;">⚠ You: MNP</div>
                </div>
            </div>

            <div class="chat-item" onclick="openChat('Ufone 5G', '#81c784')">
                <div class="avatar" style="background: #81c784;">👤</div>
                <div class="chat-details">
                    <div class="chat-top"><span class="chat-name">Ufone 5G</span><span class="chat-time">10:12 AM</span></div>
                    <div class="chat-msg">Welcome, Stay connected. Send ...</div>
                </div>
            </div>

            <!-- 9771 Chat -->
            <div class="chat-item" onclick="openChat('9771', '#ffd54f')">
                <div class="avatar" style="background: #ffd54f;">👤</div>
                <div class="chat-details">
                    <div class="chat-top"><span class="chat-name">9771</span><span class="chat-time">10:05 AM</span></div>
                    <div class="chat-msg rtl-text" id="preview-token-msg">آپ ٹوکن نمبر 7715583817 سے سواری ن...</div>
                </div>
            </div>
        </div>

        <!-- Start Chat FAB -->
        <button class="fab" id="start-chat-btn">💬 Start chat</button>

        <!-- Chat View -->
        <div class="chat-view" id="chat-view">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()">←</button>
                <div class="avatar" id="current-avatar" style="width: 35px; height: 35px; font-size: 16px;">👤</div>
                <div class="chat-header-info" style="margin-left: 10px;">
                    <h3 id="current-name">9771</h3>
                </div>
            </div>
            
            <div class="messages-area" id="messages-area">
                <!-- Messages loaded dynamically via JS -->
            </div>

            <!-- Input Box with FIXED Send Button (No Microphone) -->
            <div class="chat-input-area">
                <div class="plus-icon">⊕</div>
                <div class="input-wrapper">
                    <input type="text" id="msg-input" placeholder="1 Jazz • Text">
                    <span class="smile-icon">😊</span>
                </div>
                <button class="send-btn" onclick="sendCustomMessage()">➤</button>
            </div>
        </div>

    </div>

    <!-- Admin Panel -->
    <div class="admin-overlay" id="admin-overlay">
        <div class="admin-panel">
            <h3>Admin Settings</h3>
            
            <label>Update Bike/Sawari Number</label>
            <input type="text" id="bike-input" placeholder="Enter bike number" value="LEX-11-2277">

            <label>Update Token Number</label>
            <input type="text" id="token-input" placeholder="Enter token number" value="7715583817">

            <div class="admin-buttons">
                <button class="btn-close" onclick="closeAdmin()">Cancel</button>
                <button class="btn-save" onclick="updateData()">Update Data</button>
            </div>
        </div>
    </div>

    <!-- Action Menu (Delete/Forward) -->
    <div class="action-menu-overlay" id="action-menu-overlay">
        <div class="action-menu">
            <button class="action-menu-btn" onclick="forwardMessage()">➡️ Forward</button>
            <button class="action-menu-btn danger" onclick="deleteMessage()">🗑️ Delete</button>
            <button class="action-menu-btn" onclick="closeActionMenu()" style="justify-content:center; color:#1a73e8;">Cancel</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Message Deleted</div>

    <script>
        // Global Variables
        let currentToken = "7715583817";
        let currentBikeNumber = "LEX-11-2277";
        let selectedMessageId = null; // Stores the ID of the message being held

        // Base Chat Data Array
        let messagesData = [
            { id: 1, type: 'received', text: 'آپ ٹوکن نمبر 7715583817 سے سواری رجسٹر ہو سکتی ہے۔', rtl: true },
            { id: 2, type: 'sent', text: 'REG 3230373410243 LEX2277 P 09052011' },
            { id: 3, type: 'received', text: 'رجسٹریشن ناکام۔ 8 گھنٹے بعد دوبارہ کوشش کریں۔', rtl: true },
            { id: 4, type: 'system', text: 'Sending with Jazz' },
            { id: 5, type: 'sent', text: 'REG 3230373410243 LEX2277 P 09052011' },
            { id: 6, type: 'received', text: 'رجسٹریشن کامیاب! فائل ریلیف ٹوکن کے لئے TOK لکھ کر بھیجیں۔', rtl: true },
            { id: 7, type: 'sent', text: 'TOK' }
        ];

        function getTokenMessage() {
            return `آپ ٹوکن نمبر ${currentToken} سے سواری نمبر ${currentBikeNumber} کے لیے 500 روپے کا فائل ریلیف حاصل کر سکتے ہیں۔ یہ ٹوکن 10:05 تا 01-Nov قابل استعمال ہے۔`;
        }

        // --- Chat Functions ---
        function openChat(id, color) {
            document.getElementById('main-list').style.display = 'none';
            document.getElementById('chat-view').style.display = 'flex';
            document.getElementById('current-name').innerText = id;
            
            const avatarDiv = document.getElementById('current-avatar');
            avatarDiv.innerText = '👤';
            avatarDiv.style.background = color;

            if(id === '9771') {
                renderAllMessages();
            } else {
                document.getElementById('messages-area').innerHTML = `<div style="text-align:center; color:#888; margin-top:20px;">No messages to display.</div>`;
            }
        }

        function renderAllMessages() {
            const area = document.getElementById('messages-area');
            area.innerHTML = '';

            // 1. Render standard messages
            messagesData.forEach(msg => {
                renderBubble(area, msg.type, msg.text, msg.rtl, msg.id);
            });

            // 2. Render Dynamic Token Message
            const tokenDiv = document.createElement('div');
            tokenDiv.className = 'msg-bubble msg-received rtl-text';
            tokenDiv.innerText = getTokenMessage();
            // Add long press to dynamic token too
            addLongPressEvent(tokenDiv, 'dynamic_token');
            area.appendChild(tokenDiv);
            
            // 3. Render Jazz footer
            const jazzDiv = document.createElement('div');
            jazzDiv.className = 'jazz-text';
            jazzDiv.innerHTML = '• Jazz';
            area.appendChild(jazzDiv);
            
            setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
        }

        function renderBubble(container, type, text, isRtl, msgId) {
            if(type === 'system') {
                const div = document.createElement('div');
                div.className = 'sending-text';
                div.innerHTML = 'Sending with <span>Jazz</span>';
                container.appendChild(div);
                return;
            }

            const div = document.createElement('div');
            div.className = `msg-bubble ${type === 'sent' ? 'msg-sent' : 'msg-received'}`;
            if (isRtl) div.classList.add('rtl-text');
            div.innerText = text;
            
            if(msgId) {
                addLongPressEvent(div, msgId);
            }
            
            container.appendChild(div);
        }

        // --- Long Press to Open Menu (Delete/Forward) ---
        let pressTimer;
        
        function addLongPressEvent(element, msgId) {
            // Mobile Touch Events
            element.addEventListener('touchstart', (e) => {
                element.classList.add('active-press');
                pressTimer = setTimeout(() => {
                    element.classList.remove('active-press');
                    openActionMenu(msgId);
                }, 1000); // 1 second hold
            });
            element.addEventListener('touchend', () => {
                element.classList.remove('active-press');
                clearTimeout(pressTimer);
            });
            element.addEventListener('touchmove', () => {
                element.classList.remove('active-press');
                clearTimeout(pressTimer);
            });

            // Desktop Mouse Events
            element.addEventListener('mousedown', () => {
                element.classList.add('active-press');
                pressTimer = setTimeout(() => {
                    element.classList.remove('active-press');
                    openActionMenu(msgId);
                }, 1000);
            });
            element.addEventListener('mouseup', () => {
                element.classList.remove('active-press');
                clearTimeout(pressTimer);
            });
            element.addEventListener('mouseleave', () => {
                element.classList.remove('active-press');
                clearTimeout(pressTimer);
            });
        }

        function openActionMenu(msgId) {
            selectedMessageId = msgId;
            document.getElementById('action-menu-overlay').style.display = 'flex';
        }

        function closeActionMenu() {
            document.getElementById('action-menu-overlay').style.display = 'none';
            selectedMessageId = null;
        }

        function deleteMessage() {
            if(selectedMessageId === 'dynamic_token') {
                showToast("This auto-message cannot be deleted.");
                closeActionMenu();
                return;
            }
            
            messagesData = messagesData.filter(m => m.id !== selectedMessageId);
            renderAllMessages();
            showToast("Message Deleted");
            closeActionMenu();
        }

        function forwardMessage() {
            // Simple alert for forward functionality
            showToast("Message Forwarded!");
            closeActionMenu();
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function closeChat() {
            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('main-list').style.display = 'block';
        }

        // Send custom message from input box
        function sendCustomMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;

            const newId = Date.now();
            messagesData.push({ id: newId, type: 'sent', text: text });
            
            input.value = '';
            renderAllMessages();
        }

        // --- Admin Panel Logic ---
        let clickCount = 0;
        let clickTimer = null;

        document.getElementById('start-chat-btn').addEventListener('click', function() {
            clickCount++;
            if (clickCount === 3) {
                openAdmin();
                clickCount = 0; 
                clearTimeout(clickTimer);
            } else {
                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => { clickCount = 0; }, 600);
            }
        });

        function openAdmin() {
            document.getElementById('admin-overlay').style.display = 'flex';
            document.getElementById('token-input').value = currentToken;
            document.getElementById('bike-input').value = currentBikeNumber;
        }

        function closeAdmin() {
            document.getElementById('admin-overlay').style.display = 'none';
        }

        function updateData() {
            const newToken = document.getElementById('token-input').value.trim();
            const newBike = document.getElementById('bike-input').value.trim();
            
            if(newToken === "" || newBike === "") {
                alert("Fields cannot be empty!");
                return;
            }

            currentToken = newToken;
            currentBikeNumber = newBike;

            document.getElementById('preview-token-msg').innerText = `آپ ٹوکن نمبر ${currentToken} سے سواری ن...`;

            if(document.getElementById('chat-view').style.display === 'flex') {
                renderAllMessages();
            }

            showToast("Data Updated Successfully!");
            closeAdmin();
        }
    </script>
</body>
</html>
